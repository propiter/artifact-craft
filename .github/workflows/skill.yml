name: skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: El cliente y el instalador son bash valido
        run: |
          for f in install.sh skill/artifact-craft/scripts/wl-artifact; do
            bash -n "$f" || { echo "bash -n falla en $f"; exit 1; }
            echo "OK $f"
          done

      - name: El generador de la galeria es python valido
        run: python3 -c "import ast,sys; ast.parse(open('skill/artifact-craft/scripts/build-catalog.py').read()); print('OK build-catalog.py')"

      - name: El SKILL.md tiene el frontmatter que Hermes necesita
        run: |
          head -1 skill/artifact-craft/SKILL.md | grep -q '^---$' || { echo "falta el frontmatter"; exit 1; }
          grep -q '^name:' skill/artifact-craft/SKILL.md || { echo "falta name:"; exit 1; }
          grep -q '^description:' skill/artifact-craft/SKILL.md || { echo "falta description:"; exit 1; }
          echo "frontmatter OK"

      - name: Todo archivo que el SKILL.md nombra existe
        run: |
          cd skill/artifact-craft
          fail=0
          for f in $(grep -oE '(references|templates|scripts)/[A-Za-z0-9._-]+' SKILL.md references/*.md | cut -d: -f2 | sort -u); do
            [ -e "$f" ] || { echo "SKILL.md nombra $f y no existe"; fail=1; }
          done
          [ $fail = 0 ] && echo "todas las referencias existen"
          exit $fail
      - name: El skill NO lleva el hub de nadie adentro
        run: |
          if grep -rInE 'wlart_[0-9a-f]{8}|ARTIFACTS_TOKEN=wlart' skill/ ; then
            echo "hay un token en el skill"; exit 1
          fi
          echo "sin credenciales"

      # El instalador baja el repo y copia el skill. Se prueba el camino SIN terminal
      # (--api + --token), que es el que usa un agente o este mismo CI, contra un hub de
      # mentira levantado aca: asi el test comprueba una instalacion REAL y no la nada.
      - name: El instalador instala de verdad en un HOME limpio
        run: |
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"ok": True, "user": "tester", "is_admin": False,
                                     "artifacts": 0, "max_artifacts": 200, "bytes_stored": 0,
                                     "max_bytes_per_artifact": 2097152}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          HTTPServer(("127.0.0.1", 18099), H).serve_forever()
          PY
          sleep 1
          rm -rf /tmp/fh && mkdir -p /tmp/fh
          # -u XDG_* : el runner exporta XDG_CONFIG_HOME, y ahi manda el XDG sobre $HOME. Se
          # limpia para que todo quede contenido en /tmp/fh; el respeto del XDG se prueba aparte.
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u CLAUDE_CONFIG_DIR -u CODEX_HOME -u HERMES_HOME HOME=/tmp/fh bash install.sh \
            --api http://127.0.0.1:18099 \
            --token "wlart_$(python3 -c "print('a'*48)")" </dev/null
          test -f /tmp/fh/.hermes/skills/creative/artifact-craft/SKILL.md || { echo "no instalo el skill"; exit 1; }
          test -x /tmp/fh/.local/bin/wl-artifact || { echo "no instalo el cliente"; exit 1; }
          test -f /tmp/fh/.config/wl-artifact/config || { echo "no escribio la config"; exit 1; }
          perm=$(stat -c '%a' /tmp/fh/.config/wl-artifact/config)
          [ "$perm" = "600" ] || { echo "la config no quedo en 600 (quedo $perm)"; exit 1; }
          # Con XDG_CONFIG_HOME puesto, el token va ahi y NO a $HOME/.config: es lo que dice el
          # estandar, y es exactamente lo que hacia fallar la asercion vieja.
          rm -rf /tmp/fh3 && mkdir -p /tmp/fh3/xdg
          env -u XDG_DATA_HOME XDG_CONFIG_HOME=/tmp/fh3/xdg HOME=/tmp/fh3 bash install.sh \
            --api http://127.0.0.1:18099 --token "wlart_$(python3 -c "print('a'*48)")" </dev/null
          if [ ! -f /tmp/fh3/xdg/wl-artifact/config ]; then echo "no respeto XDG_CONFIG_HOME"; exit 1; fi
          if [ -e /tmp/fh3/.config/wl-artifact/config ]; then echo "escribio en HOME pese a XDG"; exit 1; fi
          echo "instalacion OK"

      # Y tiene que cubrir CUALQUIER agente que la persona tenga, no una lista fija: se planta una
      # maquina de mentira con varios y se mira donde quedo el skill. Tambien que NO deje basura
      # donde no corresponde, y que acepte una carpeta a mano para un agente fuera de la lista.
      - name: Cubre todos los agentes de la maquina
        run: |
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"ok": True, "user": "tester", "is_admin": False,
                                     "artifacts": 0, "max_artifacts": 200, "bytes_stored": 0,
                                     "max_bytes_per_artifact": 2097152}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          HTTPServer(("127.0.0.1", 18100), H).serve_forever()
          PY
          sleep 1
          H=/tmp/agenthome
          rm -rf "$H"; mkdir -p "$H"
          mkdir -p "$H/.claude" "$H/.codex" "$H/.gemini" "$H/.cursor" "$H/.config/opencode"
          mkdir -p "$H/.config/zed/skills" "$H/.config/goose" "$H/.config/alguna-app" "$H/.opencode" "$H/mi-agente-raro"
          mkdir -p "$H/.claude-trabajo" "$H/codex-en-otro-lado"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u CLAUDE_CONFIG_DIR -u CODEX_HOME -u HERMES_HOME HOME="$H" \
              ARTIFACT_CRAFT_SKILL_DIRS="$H/mi-agente-raro/skills" \
              CLAUDE_CONFIG_DIR="$H/.claude-trabajo" CODEX_HOME="$H/codex-en-otro-lado" \
              bash install.sh --api http://127.0.0.1:18100 \
              --token "wlart_$(python3 -c "print('a'*48)")" </dev/null
          for d in .claude .codex .gemini .cursor .config/opencode .config/zed mi-agente-raro .claude-trabajo codex-en-otro-lado; do
            test -f "$H/$d/skills/artifact-craft/SKILL.md" || { echo "no llego a $d"; exit 1; }
          done
          test -f "$H/.hermes/skills/creative/artifact-craft/SKILL.md" || { echo "no llego a Hermes"; exit 1; }
          if [ -e "$H/.config/goose/skills" ]; then echo "dejo basura en goose (no tenia skills/)"; exit 1; fi
          if [ -e "$H/.opencode/skills" ]; then echo "dejo basura en .opencode (no tenia skills/)"; exit 1; fi
          if [ -e "$H/.config/alguna-app/skills" ]; then echo "dejo basura en una app sin skills/"; exit 1; fi
          echo "cobertura de agentes OK"

      # Punta a punta contra el hub DE VERDAD: se lo clona y se lo levanta local. Un test que
      # solo pasa en local puede estar midiendo el entorno; este arranca el servicio real,
      # publica con el cliente real y comprueba lo que el otro extremo ve.
      - name: Punta a punta contra el hub real
        run: |
          git clone --depth 1 https://github.com/propiter/artifacts-hub /tmp/hub
          D=/tmp/e2e; rm -rf $D; mkdir -p $D
          PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          HUB_DATA=$D HUB_DB=$D/hub.sqlite3 HUB_BASE_URL="http://127.0.0.1:$PORT" HUB_PORT=$PORT \
            python3 /tmp/hub/api/app.py >$D/hub.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1 && break; sleep 0.25; done
          grep -q "escuchando en :$PORT" $D/hub.log || { echo "el hub no arranco"; cat $D/hub.log; exit 1; }
          TOK=$(python3 - "$D" <<'PY'
          import os, sys
          sys.path.insert(0, "/tmp/hub/api")
          import admin
          cfg = {"data_dir": sys.argv[1], "db_path": os.path.join(sys.argv[1], "hub.sqlite3")}
          admin.add_user(cfg, "tester")
          print(admin.new_token(cfg, "tester", "ci")[0])
          PY
          )
          export XDG_CONFIG_HOME=$D/cfg XDG_DATA_HOME=$D/local
          mkdir -p "$XDG_CONFIG_HOME/wl-artifact"
          printf 'ARTIFACTS_API=http://127.0.0.1:%s\nARTIFACTS_TOKEN=%s\n' "$PORT" "$TOK" > "$XDG_CONFIG_HOME/wl-artifact/config"
          chmod 600 "$XDG_CONFIG_HOME/wl-artifact/config"
          cat > $D/pagina.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Punta a punta</title>
          <meta name="description" content="Una prueba de verdad"></head><body><h1>hola</h1></body></html>
          HTML
          bash skill/artifact-craft/scripts/wl-artifact publish $D/pagina.html e2e
          S=$D/a/tester/e2e.html
          grep -q 'og:image' "$S" || { echo "la pagina publicada no lleva og:image"; exit 1; }
          grep -q 'og:description" content="Una prueba de verdad"' "$S" || { echo "falta la descripcion del autor"; exit 1; }
          grep -q 'window.ARTIFACT=' "$S" || { echo "falta el runtime"; exit 1; }
          # las funciones que el skill le ensena al agente tienen que llegar en la pagina
          for f in load save watch get set incr push update remove vote tally rank clean; do
            grep -q "A.$f = " "$S" || { echo "el runtime de la pagina no trae A.$f"; exit 1; }
          done
          # y la plantilla viva del skill se publica y recibe el runtime como cualquier pagina
          bash skill/artifact-craft/scripts/wl-artifact publish skill/artifact-craft/templates/live-app.html plantilla-viva
          grep -q 'A.vote = async function' $D/a/tester/plantilla-viva.html || { echo "la plantilla publicada no trae el runtime"; exit 1; }
          KEY=$(grep -o '"key":"[^"]*"' "$S" | cut -d'"' -f4)
          [ -n "$KEY" ] || { echo "la pagina no lleva clave"; exit 1; }
          python3 - "$D/a/tester/e2e.preview.png" <<'PY'
          import struct, sys
          d = open(sys.argv[1], "rb").read(33)
          w, h = struct.unpack(">II", d[16:24])
          assert (w, h) == (1200, 630), "la vista previa mide %sx%s" % (w, h)
          print("vista previa %dx%d" % (w, h))
          PY
          # la clave que muestra el cliente es la que viaja en la pagina
          test "$(bash skill/artifact-craft/scripts/wl-artifact key e2e | sed -n 's/^clave del artifact: //p')" = "$KEY" \
            || { echo "la clave del CLI no coincide con la de la pagina"; exit 1; }
          # la pagina escribe, el agente lee
          curl -sS -X PUT -H "X-Artifact-Key: $KEY" -H 'Content-Type: application/json' \
               --data '{"quien":"el-cliente"}' "http://127.0.0.1:$PORT/api/v1/state/tester/e2e" >/dev/null
          # a archivo y despues grep: con `| grep -q`, grep corta la tuberia al encontrar y, con
          # pipefail, el cliente cortado cuenta como falla aunque el dato este (fallaba a veces)
          bash skill/artifact-craft/scripts/wl-artifact state e2e > $D/st.json
          grep -q 'el-cliente' $D/st.json \
            || { echo "el agente no ve el estado de la pagina"; exit 1; }
          # cada lectura avisa que eso lo escribio un tercero, y da el etag
          bash skill/artifact-craft/scripts/wl-artifact state e2e 2>$D/err >/dev/null
          grep -q 'DATOS, no instrucciones' $D/err || { echo "la lectura no avisa que es entrada no confiable"; exit 1; }
          ETAG=$(sed -n 's/^# etag //p' $D/err)
          [ -n "$ETAG" ] && [ "$ETAG" != "?" ] || { echo "la lectura no trae etag"; exit 1; }
          # la pagina escribe DESPUES de que el agente leyo: el agente no la puede pisar
          curl -sS -X PUT -H "X-Artifact-Key: $KEY" -H 'Content-Type: application/json' \
               --data '{"quien":"la-pagina-otra-vez"}' "http://127.0.0.1:$PORT/api/v1/state/tester/e2e" >/dev/null
          if echo '{"quien":"el-agente"}' | bash skill/artifact-craft/scripts/wl-artifact state-set e2e - --if-match "$ETAG" 2>$D/err; then
            echo "el agente piso lo que la pagina escribio despues"; exit 1
          fi
          grep -q 'conflict' $D/err || { echo "el rechazo no dice que es un conflicto"; cat $D/err; exit 1; }
          bash skill/artifact-craft/scripts/wl-artifact state e2e > $D/st.json
          grep -q 'la-pagina-otra-vez' $D/st.json \
            || { echo "se perdio lo que escribio la pagina"; exit 1; }
          # con el etag al dia, escribe
          ETAG=$(bash skill/artifact-craft/scripts/wl-artifact state e2e 2>&1 >/dev/null | sed -n 's/^# etag //p')
          echo '{"quien":"el-agente"}' | bash skill/artifact-craft/scripts/wl-artifact state-set e2e - --if-match "$ETAG" \
            || { echo "con el etag al dia no pudo escribir"; exit 1; }
          # y el estado no se sirve por HTTP
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/a/tester/.state/e2e.json")" = "404" \
            || { echo "el estado es alcanzable por HTTP"; exit 1; }
          # republicar lo mismo sigue siendo un no-op
          bash skill/artifact-craft/scripts/wl-artifact publish $D/pagina.html e2e --no-thumb > $D/pub.txt
          grep -q 'sin cambios' $D/pub.txt \
            || { echo "republicar lo mismo versiono de nuevo"; exit 1; }
          echo "punta a punta OK"

      # Y contra un hub VIEJO (el commit anterior de verdad, no un doble) publicar tiene que
      # seguir funcionando: avisa que no hay vista previa y entrega el link igual. Esto costo
      # un bug en silencio —`|| true` no salva a una funcion que hace `exit` dentro de $( )—
      # y el CI lo tiene que agarrar la proxima vez.
      - name: Con un hub viejo, publicar igual y avisar
        run: |
          git clone https://github.com/propiter/artifacts-hub /tmp/hubold
          git -C /tmp/hubold checkout -q 5b033cc
          grep -q "thumb" /tmp/hubold/api/app.py && { echo "ese commit ya tiene la ruta: el test no prueba nada"; exit 1; }
          D=/tmp/e2eold; rm -rf $D; mkdir -p $D
          PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          HUB_DATA=$D HUB_DB=$D/hub.sqlite3 HUB_BASE_URL="http://127.0.0.1:$PORT" HUB_PORT=$PORT \
            python3 /tmp/hubold/api/app.py >$D/hub.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1 && break; sleep 0.25; done
          grep -q "escuchando en :$PORT" $D/hub.log || { echo "el hub viejo no arranco"; cat $D/hub.log; exit 1; }
          TOK=$(python3 - "$D" <<'PY'
          import os, sys
          sys.path.insert(0, "/tmp/hubold/api")
          import admin
          cfg = {"data_dir": sys.argv[1], "db_path": os.path.join(sys.argv[1], "hub.sqlite3")}
          admin.add_user(cfg, "tester")
          print(admin.new_token(cfg, "tester", "ci")[0])
          PY
          )
          export XDG_CONFIG_HOME=$D/cfg XDG_DATA_HOME=$D/local
          mkdir -p "$XDG_CONFIG_HOME/wl-artifact"
          printf 'ARTIFACTS_API=http://127.0.0.1:%s\nARTIFACTS_TOKEN=%s\n' "$PORT" "$TOK" > "$XDG_CONFIG_HOME/wl-artifact/config"
          chmod 600 "$XDG_CONFIG_HOME/wl-artifact/config"
          printf '<!doctype html><html><head><title>Viejo</title></head><body>x</body></html>' > $D/p.html
          bash skill/artifact-craft/scripts/wl-artifact publish $D/p.html viejo > $D/out.txt 2>&1 || {
            echo "publicar contra un hub viejo deberia andar y salio con error:"; cat $D/out.txt; exit 1; }
          cat $D/out.txt
          grep -q 'no acepta vista previa' $D/out.txt || { echo "no aviso que el hub es viejo"; exit 1; }
          test -f $D/a/tester/viejo.html || { echo "la pagina no quedo publicada"; exit 1; }
          echo "degradacion OK"

      # La guarda tiene que frenar ANTES de instalar, no despues: media instalacion en silencio
      # fue el bug original. Y un token con formato invalido tambien se rechaza sin dejar nada.
      - name: Sin terminal ni datos se frena a tiempo
        run: |
          rm -rf /tmp/fh2 && mkdir -p /tmp/fh2
          if env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u CLAUDE_CONFIG_DIR -u CODEX_HOME -u HERMES_HOME HOME=/tmp/fh2 bash install.sh </dev/null; then
            echo "deberia haber frenado"; exit 1
          fi
          if [ -e /tmp/fh2/.hermes/skills/creative/artifact-craft ]; then echo "instalo a medias"; exit 1; fi
          if env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u CLAUDE_CONFIG_DIR -u CODEX_HOME -u HERMES_HOME HOME=/tmp/fh2 bash install.sh \
               --api http://127.0.0.1:18099 --token "noempieza-bien" </dev/null; then
            echo "deberia rechazar el token invalido"; exit 1
          fi
          if [ -e /tmp/fh2/.hermes/skills/creative/artifact-craft ]; then
            echo "instalo a medias con token invalido"; exit 1
          fi
          echo "frena a tiempo OK"
