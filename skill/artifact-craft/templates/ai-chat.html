<!doctype html>
<!--
  ai-chat.html — a working AI chat: streaming answers, markdown, starter questions, errors.
  Direction: Warm product, quiet variant (references/design.md #4). AI: A.ai.chat from the runtime
  the hub injects (references/ai.md, "Chat"). Copy it, rewrite SYSTEM and the starters for the
  page's subject, translate the copy, publish: the AI answers only on the published link.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask the assistant</title>
<meta name="description" content="A focused AI assistant. Ask anything about the topic and get a clear answer.">
<style>
:root{
  --bg:#fbf8f4; --surface:#ffffff; --text:#221d19; --muted:#7a6f66; --line:#ece4da;
  --accent:#e2603f; --accent-soft:#fbe7e0; --user:#2f2a26; --user-text:#fbf8f4; --bad:#c0392b;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --radius:18px; --shadow:0 1px 2px rgba(34,29,25,.05), 0 12px 32px -16px rgba(34,29,25,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120f; --surface:#1f1b17; --text:#f3ece4; --muted:#a99c90; --line:#332c25;
    --accent:#ff8a6b; --accent-soft:#3a2219; --user:#f3ece4; --user-text:#15120f; --bad:#ff7b6b;
    --shadow:0 0 0 1px var(--line);
  }
}
:root[data-theme="dark"]{
  --bg:#15120f; --surface:#1f1b17; --text:#f3ece4; --muted:#a99c90; --line:#332c25;
  --accent:#ff8a6b; --accent-soft:#3a2219; --user:#f3ece4; --user-text:#15120f; --bad:#ff7b6b;
  --shadow:0 0 0 1px var(--line);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%}
body{font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
header{max-width:760px;width:100%;margin:0 auto;padding:22px 16px 8px;display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
header h1{font-size:19px;line-height:1.2;margin:0}
header p{margin:0;color:var(--muted);font-size:14px}
.reset{margin-left:auto;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:999px;padding:8px 14px;font:600 14px/1 var(--sans);cursor:pointer;min-height:40px}
.reset:focus-visible,.chip:focus-visible,.send:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;max-width:760px;width:100%;margin:0 auto;padding:8px 16px 16px}
.empty{padding:40px 0 8px}
.empty h2{font-size:clamp(26px,6vw,36px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  border-radius:999px;padding:10px 16px;font:500 15px/1.2 var(--sans);cursor:pointer;min-height:44px;text-align:left}
.chip:hover{border-color:var(--accent)}
.thread{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.msg{max-width:88%;padding:12px 16px;border-radius:var(--radius);overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-text);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.assistant{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.assistant.error{color:var(--bad);background:var(--accent-soft);box-shadow:none}
.msg > :first-child{margin-top:0} .msg > :last-child{margin-bottom:0}
.msg p{margin:0 0 10px} .msg ul,.msg ol{margin:0 0 10px;padding-left:22px} .msg li{margin:2px 0}
.msg h2,.msg h3,.msg h4,.msg h5{font-size:16px;margin:14px 0 6px}
.msg code{font:14px var(--mono);background:var(--accent-soft);padding:1px 5px;border-radius:6px}
.msg pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:0 0 10px}
.msg pre code{background:none;padding:0;white-space:pre}
.msg a{color:var(--accent)}
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
form{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
textarea{flex:1;border:0;background:transparent;color:var(--text);font:16px/1.45 var(--sans);resize:none;
  padding:9px 0;max-height:160px;min-height:24px}
textarea:focus{outline:none}
.send{appearance:none;border:0;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;cursor:pointer;flex:none}
.send[disabled]{opacity:.45;cursor:default}
.note{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.typing i{animation:none}}
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  </div>
  <div>
    <h1>Ask the assistant</h1>
    <p>Clear answers, in plain words</p>
  </div>
  <button class="reset" id="reset" type="button" hidden>New chat</button>
</header>

<main>
  <section class="empty" id="empty">
    <h2>What would you like to know?</h2>
    <p id="lede">Ask in your own words. The assistant answers here, and you can keep the conversation going.</p>
    <div class="chips" id="chips"></div>
  </section>
  <div class="thread" id="thread" aria-live="polite"></div>
</main>

<footer>
  <form id="form">
    <label for="input" style="position:absolute;left:-9999px">Your message</label>
    <textarea id="input" rows="1" placeholder="Write a message…" maxlength="4000"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <p class="note">AI can be wrong. Check anything important.</p>
</footer>

<script>
(() => {
  "use strict";
  // Rewrite these two for the page's subject: a focused assistant beats a blank chatbot.
  const SYSTEM = "You are a friendly, precise assistant. Answer in the user's language, briefly, " +
                 "using short paragraphs and lists when they help. If you are not sure, say so.";
  const STARTERS = ["Explain this to me like I'm new", "Give me three ideas to start", "What should I avoid?"];

  const A = window.ARTIFACT;
  const live = !!(A && A.live);
  const $ = id => document.getElementById(id);
  const thread = $("thread"), input = $("input"), send = $("send");
  const chat = live ? A.ai.chat({ system: SYSTEM, keep: 16 }) : null;

  function explain(e) {
    switch (e.code) {
      case "ai_rate_limited": return "You've used your messages for this hour — try again in " +
                                     Math.ceil((e.retryAfter || 3600) / 60) + " min.";
      case "ai_page_limit":   return "This assistant reached its limit for today. Come back tomorrow.";
      case "ai_off":          return "AI isn't available on this hub.";
      case "too_large":       return "That message is too long — shorten it, or start a new chat.";
      case "ai_timeout":
      case "ai_upstream":     return "The assistant didn't answer. Try again in a moment.";
      default:                return "Something went wrong (" + (e.code || e.message) + ").";
    }
  }
  function bubble(role) {
    const d = document.createElement("div");
    d.className = "msg " + role;
    thread.appendChild(d);
    return d;
  }
  function typing(el) {
    const t = document.createElement("span"); t.className = "typing"; t.setAttribute("aria-label", "Writing");
    t.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
    el.replaceChildren(t);
  }
  function scrollDown() { window.scrollTo({ top: document.body.scrollHeight }); }
  function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }

  async function ask(text) {
    text = text.trim();
    if (!text || send.disabled) return;
    $("empty").hidden = true; $("reset").hidden = false;
    bubble("user").textContent = text;
    input.value = ""; grow();
    const out = bubble("assistant");
    if (!live) { out.textContent = "The assistant answers once this page is published."; return; }
    typing(out); scrollDown();
    send.disabled = true;
    try {
      await chat.send(text, (piece, sofar) => { A.md(out, sofar); scrollDown(); });
    } catch (e) {
      out.textContent = explain(e);
      out.classList.add("error");
    } finally {
      send.disabled = false; input.focus();
    }
  }

  $("chips").replaceChildren(...STARTERS.map(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = s;
    b.onclick = () => ask(s);
    return b;
  }));
  $("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
  input.addEventListener("input", grow);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
  });
  $("reset").onclick = () => {
    if (chat) chat.reset();
    thread.replaceChildren(); $("empty").hidden = false; $("reset").hidden = true; input.focus();
  };
  if (!live) $("lede").textContent = "Preview: the assistant answers once this page is published.";
})();
</script>
</body>
</html>
