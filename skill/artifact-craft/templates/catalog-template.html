<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Artifacts</title>
<style>
:root{
  --bg:#fbfbfd; --fg:#16181d; --muted:#6b7280; --line:rgba(17,24,39,.10);
  --card:#fff; --accent:#3b6ef0; --chip:rgba(17,24,39,.05);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --fg:#e9eaee; --muted:#9aa1ac; --line:rgba(255,255,255,.11);
  --card:#171a20; --accent:#8ab4ff; --chip:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:40px 22px 64px}
h1{font-size:25px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 24px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 24px}
input[type=search]{flex:1 1 240px;min-width:200px;padding:10px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;outline:none}
input[type=search]:focus{border-color:var(--accent)}
.sort{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.sort button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;
  padding:9px 14px;cursor:pointer}
.sort button[aria-pressed=true]{background:var(--chip);color:var(--fg)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s ease,box-shadow .12s ease}
.card:hover{transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:4/3;background:var(--chip);overflow:hidden;
  border-bottom:1px solid var(--line)}
.thumb iframe{position:absolute;top:0;left:0;width:150%;height:150%;border:0;
  transform:scale(.6667);transform-origin:top left;pointer-events:none}
/* Señal de que el preview esta recortado, para que no parezca que falta contenido. */
.thumb:after{content:'';position:absolute;left:0;right:0;bottom:0;height:42px;
  background:linear-gradient(to bottom,transparent,var(--card));pointer-events:none}
.meta{padding:14px 15px 15px;display:flex;flex-direction:column;gap:9px}
.ttl{font-weight:600;font-size:14.5px;letter-spacing:-.01em;word-break:break-word}
.file{font:11.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);word-break:break-all}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.acts{display:flex;gap:8px}
a.btn,button.btn{font:inherit;font-size:12.5px;text-decoration:none;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line);color:var(--fg);background:var(--chip);cursor:pointer;white-space:nowrap}
a.btn:hover,button.btn:hover{border-color:var(--accent);color:var(--accent)}
a.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
a.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.empty{color:var(--muted);text-align:center;padding:64px 20px;border:1px dashed var(--line);border-radius:14px}
footer{margin-top:36px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:16px;line-height:1.7}
footer code{font:11.5px ui-monospace,monospace;background:var(--chip);padding:2px 6px;border-radius:5px;color:var(--fg)}
footer a{color:var(--accent)}
kbd{font:11px/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:var(--chip);color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Artifacts</h1>
  <p class="sub" id="sub">cargando…</p>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar por nombre…    " autocomplete="off" spellcheck="false">
    <div class="sort" id="sort">
      <button data-s="recent" aria-pressed="true">Recientes</button>
      <button data-s="name" aria-pressed="false">Nombre</button>
      <button data-s="size" aria-pressed="false">Tamaño</button>
    </div>
    <div class="sort" id="prev">
      <button data-p="on" aria-pressed="true">Vista previa</button>
      <button data-p="off" aria-pressed="false">Sólo datos</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <footer>
    <strong>Catálogo local.</strong> Este archivo no se sirve por HTTP: vive en tu disco y por eso
    puede mostrar la lista completa. Los artifacts viven en
    <a href="__HOSTURL__" target="_blank" rel="noreferrer"><code>__HOST__</code></a>, cada uno con su
    propia URL — ahí no hay catálogo, a propósito.<br>
    Atajos: <kbd>/</kbd> buscar · <kbd>Esc</kbd> limpiar
  </footer>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var RAW = document.getElementById('data').textContent.trim();
  var D = { generated: 0, host: '', items: [] };
  try { D = JSON.parse(RAW); } catch (e) { D.items = []; }
  var items = D.items || [];
  var sort = 'recent', previews = true;

  function fmtSize(b){
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }
  function fmtDate(t){
    var d = new Date(t*1000);
    return d.toLocaleString('es', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function rel(t){
    var s = (Date.now()/1000) - t;
    if (s < 90) return 'recién';
    if (s < 3600) return 'hace ' + Math.round(s/60) + ' min';
    if (s < 86400) return 'hace ' + Math.round(s/3600) + ' h';
    if (s < 2592000) return 'hace ' + Math.round(s/86400) + ' d';
    return fmtDate(t);
  }
  function titleOf(n){
    return n.replace(/\.html$/,'').replace(/-[0-9a-f]{8,}$/,'')
            .replace(/[-_]+/g,' ').trim()
            .replace(/^./, function(c){ return c.toUpperCase(); });
  }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var sub = document.getElementById('sub');

  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var list = items.filter(function(a){ return a.name.toLowerCase().indexOf(q) !== -1; });
    list.sort(function(a,b){
      if (sort === 'name') return a.name.localeCompare(b.name);
      if (sort === 'size') return b.size - a.size;
      return b.mtime - a.mtime;
    });
    sub.textContent = items.length + (items.length === 1 ? ' artifact' : ' artifacts')
      + ' · ' + list.length + ' mostrados · catálogo generado ' + fmtDate(D.generated);
    empty.hidden = list.length > 0;
    empty.textContent = items.length === 0
      ? 'Todavía no publicaste ningún artifact.'
      : 'Ningún artifact coincide con "' + q + '".';
    while (grid.firstChild) grid.removeChild(grid.firstChild);

    list.forEach(function(a){
      var card = el('article','card');
      var thumb = el('div','thumb');
      if (previews){
        var fr = document.createElement('iframe');
        fr.loading = 'lazy';
        fr.src = a.url;
        fr.setAttribute('tabindex','-1');
        fr.setAttribute('title','Vista previa de ' + titleOf(a.name));
        thumb.appendChild(fr);
      } else {
        thumb.appendChild(el('div','file', a.url));
      }
      var meta = el('div','meta');
      meta.appendChild(el('div','ttl', (a.title && a.title.trim()) ? a.title.trim() : titleOf(a.name)));
      meta.appendChild(el('div','file', a.name));
      var row = el('div','row');
      var when = el('span', null, fmtSize(a.size) + ' · ');
      var abbr = el('span', null, rel(a.mtime));
      abbr.title = fmtDate(a.mtime);
      when.appendChild(abbr);
      row.appendChild(when);
      var acts = el('div','acts');
      var open = el('a','btn primary','Abrir');
      open.href = a.url; open.target = '_blank'; open.rel = 'noreferrer';
      var copy = el('button','btn','Copiar URL');
      copy.addEventListener('click', function(){
        var done = function(){ copy.textContent = 'Copiado'; setTimeout(function(){ copy.textContent = 'Copiar URL'; }, 1200); };
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(a.url).then(done, function(){ copy.textContent = 'No se pudo'; });
        } else { copy.textContent = 'No se pudo'; }
      });
      acts.appendChild(open); acts.appendChild(copy);
      row.appendChild(acts);
      meta.appendChild(row);
      card.appendChild(thumb); card.appendChild(meta);
      grid.appendChild(card);
    });
  }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('sort').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    sort = b.dataset.s;
    [].forEach.call(this.querySelectorAll('button'), function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });
  document.getElementById('prev').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    previews = (b.dataset.p === 'on');
    [].forEach.call(this.querySelectorAll('button'), function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });
  document.addEventListener('keydown', function(ev){
    var q = document.getElementById('q');
    if (ev.key === '/' && document.activeElement !== q){ ev.preventDefault(); q.focus(); }
    if (ev.key === 'Escape' && document.activeElement === q){ q.value = ''; render(); q.blur(); }
  });
  render();
})();
</script>
</body>
</html>
